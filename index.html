<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mis Listas de Oración - Estilo Notion</title>
  
  <!-- Apple Mobile Web App & Touch Icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mis Listas">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Botón flotante para abrir/cerrar sidebar en móvil -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Menú de categorías">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <button id="mobile-add-btn" class="mobile-add-btn" aria-label="Añadir entrada">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Backdrop para cerrar sidebar en móvil -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- SIDEBAR (Estilo Notion) -->
    <aside id="app-sidebar" class="sidebar">
      
      <!-- Contenedor scrollable superior -->
      <div class="sidebar-scrollable-content" style="flex-grow: 1; overflow-y: auto;">
        <!-- Menú principal de Navegación -->
        <div class="sidebar-section" style="padding-top: 16px; padding-bottom: 0;">
          <ul class="sidebar-menu">
            <li>
              <button id="tab-people" class="menu-item navigation-menu-item active">
                <span class="menu-item-left">👥 Listas</span>
              </button>
            </li>
            <li>
              <button id="tab-matters" class="menu-item navigation-menu-item">
                <span class="menu-item-left">📌 Asuntos Pendientes</span>
              </button>
            </li>
          </ul>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 12px 6px;">

        <!-- Sección de Categorías -->
        <div class="sidebar-section">
          <div class="section-title">CATEGORÍAS</div>
          <ul id="categories-list" class="sidebar-menu">
            <!-- Se cargan dinámicamente -->
          </ul>
          <button id="btn-add-category" class="btn-sidebar-add hidden-in-view">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nueva categoría
          </button>
        </div>
      </div>

      <!-- Pie de página con Ajustes -->
      <div class="sidebar-footer">
        <div class="settings-panel">
          <div class="settings-title">⚙️ Ajustes</div>
          
          <!-- Opción Tema -->
          <div class="settings-row">
            <span class="settings-label">Tema</span>
            <div class="settings-options">
              <button id="theme-light" class="settings-btn active" title="Tema Claro">Claro</button>
              <button id="theme-dark" class="settings-btn" title="Tema Oscuro">Oscuro</button>
            </div>
          </div>
          
          <!-- Opción Disposición -->
          <div class="settings-row">
            <span class="settings-label">Disposición</span>
            <div class="settings-options">
              <button id="layout-1-col" class="settings-btn active" title="Lista de 1 Columna">1 Col</button>
              <button id="layout-2-col" class="settings-btn" title="Lista de 2 Columnas">2 Cols</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      
      <!-- HEADER PRINCIPAL -->
      <header class="main-header">
        <div class="header-left">
          <h1 id="main-app-title">Listas</h1>
        </div>
        
        <div class="header-right">
          <!-- Botón de añadir rápido en cabecera -->
          <button id="btn-header-add" class="btn-primary header-add-btn" title="Añadir nueva entrada" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Añadir</span>
          </button>
        </div>
      </header>

      <div class="main-body">
        <!-- BUSCADOR Y ACCIONES RÁPIDAS -->
        <section class="controls-section">
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Buscar personas, intenciones...">
          </div>
          
          <button id="btn-add-person" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Añadir persona
          </button>
          <button id="btn-add-matter" class="btn-primary hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Añadir asunto
          </button>
        </section>
  
        <!-- VISTA 1: GENTE (Todas las categorías seguidas) -->
        <section id="people-section" class="tab-content active">
          <div id="categories-container" class="categories-container">
            <!-- Se cargan dinámicamente con sus respectivas grids de personas -->
          </div>
          <div id="people-empty" class="empty-state hidden">
            <p>No hay categorías registradas.</p>
          </div>
        </section>
  
        <!-- VISTA 2: ASUNTOS (Matters) -->
        <section id="matters-section" class="tab-content">
          <div id="matters-list" class="matters-list">
            <!-- Se cargan dinámicamente -->
          </div>
          <div id="matters-empty" class="empty-state hidden">
            <p>No hay asuntos pendientes registrados.</p>
            <button id="btn-empty-add-matter" class="btn-secondary">Añadir primer asunto</button>
          </div>
        </section>
      </div>
      
    </main>

    <!-- NOTION "SIDE-PEEK" PANEL (Detalles de Persona) -->
    <div id="side-overlay" class="side-overlay"></div>
    <aside id="side-peek" class="side-peek">
      <div class="side-peek-header">
        <button id="btn-close-peek" class="btn-icon" aria-label="Cerrar panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <span class="peek-badge">Detalles</span>
      </div>

      <div class="side-peek-content">
        <!-- Nombre de la persona -->
        <div class="peek-group">
          <label class="peek-label">Nombre</label>
          <input type="text" id="peek-person-name-input" class="peek-title-input" placeholder="Escribe el nombre...">
        </div>

        <!-- Categoría -->
        <div class="peek-group">
          <label class="peek-label">Categoría</label>
          <select id="peek-person-category-select" class="peek-select">
            <!-- Se carga dinámicamente -->
          </select>
        </div>

        <hr class="peek-divider">

        <!-- Cosas Concretas / Peticiones de Oración -->
        <div class="peek-group">
          <div class="peek-prayers-header">
            <label class="peek-label">Peticiones de Oración</label>
            <span id="prayers-count" class="prayers-count">0 activas</span>
          </div>

          <!-- Formulario rápido para añadir petición -->
          <div class="add-prayer-row">
            <input type="text" id="new-prayer-input" placeholder="Añadir una petición concreta...">
            <button id="btn-add-prayer" class="btn-primary-sm">
              Añadir
            </button>
          </div>

          <!-- Listado de Peticiones Activas -->
          <ul id="active-prayers-list" class="prayers-checklist">
            <!-- Se cargan dinámicamente -->
          </ul>
        </div>
      </div>
      
      <!-- Barra inferior del Side-Peek -->
      <div class="side-peek-footer" style="padding: 16px 20px; border-top: 1px solid var(--border-color); background-color: var(--bg-card);">
        <button id="btn-delete-person" class="btn-danger" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>
          Eliminar persona
        </button>
      </div>
    </aside>

    <!-- MODAL: Crear/Editar Categoría -->
    <div id="category-modal" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modal-category-title">Nueva Categoría</h3>
          <button id="btn-close-category-modal" class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="input-group">
            <label for="category-name-input">Nombre de la categoría</label>
            <input type="text" id="category-name-input" placeholder="Ej. Primos lejanos">
          </div>
          <div class="input-group">
            <label>Color de la etiqueta</label>
            <div id="color-picker-grid" class="color-picker-grid">
              <button class="color-dot pink active" data-color="pink" title="Rosa"></button>
              <button class="color-dot red" data-color="red" title="Rojo"></button>
              <button class="color-dot orange" data-color="orange" title="Naranja"></button>
              <button class="color-dot yellow" data-color="yellow" title="Amarillo"></button>
              <button class="color-dot green" data-color="green" title="Verde"></button>
              <button class="color-dot teal" data-color="teal" title="Teal"></button>
              <button class="color-dot blue" data-color="blue" title="Azul"></button>
              <button class="color-dot indigo" data-color="indigo" title="Índigo"></button>
              <button class="color-dot purple" data-color="purple" title="Morado"></button>
              <button class="color-dot brown" data-color="brown" title="Marrón"></button>
              <button class="color-dot grey" data-color="grey" title="Gris"></button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-delete-category" class="btn-danger hidden">Eliminar</button>
          <div style="flex-grow: 1;"></div>
          <button id="btn-cancel-category" class="btn-secondary">Cancelar</button>
          <button id="btn-save-category" class="btn-primary">Guardar</button>
        </div>
      </div>
    </div>

    <!-- MODAL: Crear Nueva Entrada Unificada -->
    <div id="add-entry-modal" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modal-entry-title">Añadir Entrada</h3>
          <button id="btn-close-entry-modal" class="btn-icon" title="Cerrar modal">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        
        <div class="modal-body">
          <!-- Selector de tipo (Persona / Asunto) -->
          <div class="segmented-control">
            <button id="btn-select-person" class="segment-btn active">👤 Persona</button>
            <button id="btn-select-matter" class="segment-btn">📌 Asunto</button>
          </div>
          
          <!-- Campos para Persona -->
          <div id="form-fields-person" class="form-fields">
            <div class="input-group">
              <label for="entry-person-name">Nombre de la persona</label>
              <input type="text" id="entry-person-name" placeholder="Ej. Juan Pérez">
            </div>
            
            <div class="input-group">
              <label for="entry-person-cat">Categoría</label>
              <select id="entry-person-cat">
                <!-- Se cargan dinámicamente -->
              </select>
            </div>
            
            <!-- Creador de categoría inline (Oculto por defecto, se activa si eligen "Nueva...") -->
            <div id="inline-category-creator" class="inline-creator hidden" style="margin-top: 10px; padding: 12px; background-color: var(--bg-hover); border-radius: 8px; border: 1px solid var(--border-color);">
              <label style="font-weight: 600; font-size: 11.5px; margin-bottom: 6px; display: block;">Nueva Categoría</label>
              <input type="text" id="new-cat-name-input" placeholder="Nombre de la categoría..." style="margin-bottom: 8px; width: 100%;">
              <label style="font-size: 11px; margin-bottom: 6px; color: var(--text-secondary); display: block;">Selecciona un color:</label>
              <div id="inline-color-picker" class="color-picker-grid" style="margin-bottom: 0;">
                <button class="color-dot pink active" data-color="pink" title="Rosa"></button>
                <button class="color-dot red" data-color="red" title="Rojo"></button>
                <button class="color-dot orange" data-color="orange" title="Naranja"></button>
                <button class="color-dot yellow" data-color="yellow" title="Amarillo"></button>
                <button class="color-dot green" data-color="green" title="Verde"></button>
                <button class="color-dot teal" data-color="teal" title="Teal"></button>
                <button class="color-dot blue" data-color="blue" title="Azul"></button>
                <button class="color-dot indigo" data-color="indigo" title="Índigo"></button>
                <button class="color-dot purple" data-color="purple" title="Morado"></button>
                <button class="color-dot brown" data-color="brown" title="Marrón"></button>
                <button class="color-dot grey" data-color="grey" title="Gris"></button>
              </div>
            </div>
            
            <div class="input-group" style="margin-top: 12px;">
              <label for="entry-person-prayer">Petición inicial (Opcional)</label>
              <input type="text" id="entry-person-prayer" placeholder="Ej. Por su salud o intención...">
            </div>
          </div>
          
          <!-- Campos para Asunto -->
          <div id="form-fields-matter" class="form-fields hidden">
            <div class="input-group">
              <label for="entry-matter-title">Título del asunto</label>
              <input type="text" id="entry-matter-title" placeholder="Ej. Por la salud de España">
            </div>
            <div class="input-group">
              <label for="entry-matter-desc">Detalles / Intención</label>
              <textarea id="entry-matter-desc" placeholder="Añade más información si es necesario..."></textarea>
            </div>
            <div class="input-group">
              <label for="entry-matter-cat">Categoría / Etiqueta rápida</label>
              <input type="text" id="entry-matter-cat" placeholder="Ej. Salud, Trabajo, General" list="entry-matter-cats">
              <datalist id="entry-matter-cats">
                <option value="General"></option>
                <option value="Salud"></option>
                <option value="Trabajo"></option>
                <option value="Iglesia"></option>
              </datalist>
            </div>
          </div>
        </div>
        
        <div class="modal-footer">
          <button id="btn-cancel-entry" class="btn-secondary">Cancelar</button>
          <button id="btn-save-entry" class="btn-primary">Añadir</button>
        </div>
      </div>
    </div>

    <!-- MODAL: Confirmación de Eliminación -->
    <div id="confirm-modal" class="modal-backdrop hidden">
      <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header" style="border: none; padding-bottom: 0;">
          <h3 id="confirm-modal-title">¿Estás seguro?</h3>
        </div>
        <div class="modal-body" style="padding: 12px 20px 24px;">
          <p id="confirm-modal-message" style="font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin: 0;"></p>
        </div>
        <div class="modal-footer" style="background-color: transparent; border-top: none; padding-top: 0;">
          <button id="btn-confirm-cancel" class="btn-secondary" style="flex: 1;">Cancelar</button>
          <button id="btn-confirm-ok" class="btn-primary" style="background-color: var(--color-danger); border-color: var(--color-danger); color: #ffffff; flex: 1;">Eliminar</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JS Module Entry Point -->
  <script type="module" src="/main.js"></script>
</body>
</html>
